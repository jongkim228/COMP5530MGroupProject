[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: tests that take a significant amount of time",
  "integration: tests that exercise multiple modules in the shared scene",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
